[project]
name = "llm-red-team-framework"
version = "0.1.0"
description = "Adversarial LLM red teaming framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "colorama>=0.4.6",
    "cryptography>=41.0.0",
    "pycryptodome>=3.19.0",
]

[tool.uv]
package = true

[project.scripts]
rtf-llm = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
# Legacy attack modules are frozen/deprecated; lint-ownership tracked only on the
# maintained surface (core + engine + tests). Expressibles are excluded to keep CI green.
extend-exclude = [
    "modules/adversarial_inputs.py",
    "modules/c2_communication.py",
    "modules/comparison.py",
    "modules/context_injection.py",
    "modules/data_exfiltration.py",
    "modules/data_extraction.py",
    "modules/defense_tester.py",
    "modules/direct_attack.py",
    "modules/indirect_injection.py",
    "modules/jailbreak.py",
    "modules/multi_turn.py",
    "modules/multimodal_injection.py",
    "modules/payload_loader.py",
    "modules/persistence.py",
    "modules/polymorphic_encoding.py",
    "modules/prompt_injection.py",
    "modules/purple_team.py",
    "modules/role_confusion.py",
    "modules/system_prompt_extraction.py",
    "modules/technique_kb.py",
    "modules/weight_manipulation.py",
    "prompt-inj-attacks/",
    "scripts/",
    "generate_report.py",
    "build/",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["modules*", "modules.engine*"]
